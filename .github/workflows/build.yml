name: Build Marsh OS XFCE

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y squashfs-tools xorriso isolinux mtools wget curl grep e2fsprogs

      - name: Download latest Void XFCE ISO
        run: |
          URL="https://repo-default.voidlinux.org/live/current"
          FILE=$(curl -s "$URL/" | grep -oP 'href="\Kvoid-live-x86_64[^"]*xfce[^"]*\.iso' | sort | tail -1)
          [ -z "$FILE" ] && FILE=$(curl -s "$URL/" | grep -oP 'href="\Kvoid-live-x86_64[^"]*\.iso' | sort | tail -1)
          echo "Downloading $FILE"
          wget -O void.iso "$URL/$FILE"

      - name: Rebrand ISO (fix VOID_LIVE label)
        run: |
          mkdir mnt marsh-iso
          sudo mount -o loop void.iso mnt
          sudo cp -a mnt/. marsh-iso/
          sudo umount mnt
          cd marsh-iso

          # Распаковываем squashfs
          sudo mv LiveOS/squashfs.img LiveOS/squashfs_orig.img
          sudo unsquashfs -d LiveOS/squashfs LiveOS/squashfs_orig.img
          EXT4_FILE=$(ls LiveOS/squashfs/LiveOS/*.img 2>/dev/null | head -1)
          echo "Found ext4 image: $EXT4_FILE"

          # Монтируем ext4-образ
          sudo mkdir -p mnt_ext4
          sudo mount -o loop "$EXT4_FILE" mnt_ext4

          # Меняем бренд в системе
          sudo sed -i 's/NAME="void"/NAME="marsh"/' mnt_ext4/etc/os-release
          sudo sed -i 's/ID=void/ID=marsh/' mnt_ext4/etc/os-release
          sudo sed -i 's/PRETTY_NAME="Void Linux"/PRETTY_NAME="Marsh OS"/' mnt_ext4/etc/os-release
          echo "Marsh OS \\r \\l" | sudo tee mnt_ext4/etc/issue

          # Заменяем метку VOID_LIVE на MARSH_OS во всех конфигах внутри системы (dracut, grub)
          sudo find mnt_ext4 -type f \( -name "*.cfg" -o -name "*.conf" \) -exec sudo sed -i 's/VOID_LIVE/MARSH_OS/g' {} +

          sudo umount mnt_ext4
          sudo rmdir mnt_ext4

          # Пересоздаём squashfs.img
          sudo rm -f LiveOS/squashfs_orig.img LiveOS/squashfs.img
          sudo mksquashfs LiveOS/squashfs LiveOS/squashfs.img -comp xz -noappend
          sudo rm -rf LiveOS/squashfs

          # Правим загрузочные меню: заменяем бренд + метку VOID_LIVE
          for f in boot/grub/grub.cfg boot/grub/grub_void.cfg isolinux/isolinux.cfg boot/isolinux/isolinux.cfg; do
            if [ -f "$f" ]; then
              sudo sed -i 's/Void Linux/Marsh OS/g; s/Void/Marsh/g' "$f"
              sudo sed -i 's/VOID_LIVE/MARSH_OS/g' "$f"
            fi
          done

      - name: Build ISO (BIOS) with MARSH_OS label
        run: |
          cd marsh-iso
          sudo chmod -R a+rX .
          if [ ! -f boot/isolinux/isolinux.bin ]; then
            echo "ERROR: isolinux.bin not found!"
            exit 1
          fi
          xorriso -as mkisofs \
            -iso-level 3 -full-iso9660-filenames -volid "MARSH_OS" \
            -eltorito-boot boot/isolinux/isolinux.bin -eltorito-catalog boot/isolinux/boot.cat \
            -no-emul-boot -boot-load-size 4 -boot-info-table \
            -isohybrid-mbr /usr/lib/ISOLINUX/isohdpfx.bin \
            -output ../marsh-os.iso .

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: marsh-os-xfce-iso
          path: marsh-os.iso
