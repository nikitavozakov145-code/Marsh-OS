name: Build Marsh OS (Void XFCE rebrand)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools xorriso isolinux mtools wget curl grep e2fsprogs

      - name: Get latest Void XFCE ISO URL
        run: |
          BASE_URL="https://repo-default.voidlinux.org/live/current"
          INDEX=$(curl -s "$BASE_URL/")
          LATEST_FILE=$(echo "$INDEX" | grep -oP 'href="\K[^"]*\.iso' | grep 'void-live-x86_64.*xfce' | sort | tail -1)
          if [ -z "$LATEST_FILE" ]; then
            echo "Не удалось найти XFCE ISO. Пробую найти любой..."
            LATEST_FILE=$(echo "$INDEX" | grep -oP 'href="\K[^"]*\.iso' | grep 'void-live-x86_64' | sort | tail -1)
          fi
          echo "Найден файл: $LATEST_FILE"
          wget -O void.iso "$BASE_URL/$LATEST_FILE"

      - name: Extract and rebrand
        run: |
          mkdir -p mnt marsh-iso
          sudo mount -o loop void.iso mnt
          sudo cp -a mnt/. marsh-iso/
          sudo umount mnt

          cd marsh-iso

          # Распаковываем squashfs с ext4-образом
          sudo mv LiveOS/squashfs.img LiveOS/squashfs_orig.img
          sudo unsquashfs -d LiveOS/squashfs LiveOS/squashfs_orig.img
          EXT4_FILE=$(ls LiveOS/squashfs/LiveOS/ext3fs.img 2>/dev/null || ls LiveOS/squashfs/LiveOS/rootfs.img 2>/dev/null || ls LiveOS/squashfs/*.img 2>/dev/null)
          echo "Найден ext4-образ: $EXT4_FILE"

          mkdir mnt_ext4
          sudo mount -o loop "$EXT4_FILE" mnt_ext4

          # Меняем название системы
          sudo sed -i 's/NAME="void"/NAME="marsh"/' mnt_ext4/etc/os-release
          sudo sed -i 's/ID=void/ID=marsh/' mnt_ext4/etc/os-release
          sudo sed -i 's/PRETTY_NAME="Void Linux"/PRETTY_NAME="Marsh OS"/' mnt_ext4/etc/os-release
          echo "Marsh OS \\r \\l" | sudo tee mnt_ext4/etc/issue

          sudo umount mnt_ext4
          rmdir mnt_ext4

          # Пересоздаём squashfs.img
          sudo rm LiveOS/squashfs_orig.img LiveOS/squashfs.img
          sudo mksquashfs LiveOS/squashfs LiveOS/squashfs.img -comp xz -noappend
          sudo rm -rf LiveOS/squashfs

          # Правим загрузочные меню
          for f in boot/grub/grub.cfg boot/grub/grub_void.cfg isolinux/isolinux.cfg boot/isolinux/isolinux.cfg; do
            if [ -f "$f" ]; then
              sudo sed -i 's/Void Linux/Marsh OS/g' "$f"
              sudo sed -i 's/Void/Marsh/g' "$f"
            fi
          done

      - name: Create bootable ISO (BIOS)
        run: |
          cd marsh-iso
          sudo chmod -R a+rX .

          if [ ! -f boot/isolinux/isolinux.bin ]; then
            echo "ERROR: boot/isolinux/isolinux.bin не найден!"
            exit 1
          fi

          xorriso -as mkisofs \
            -iso-level 3 \
            -full-iso9660-filenames \
            -volid "MARSH_OS" \
            -eltorito-boot boot/isolinux/isolinux.bin \
            -eltorito-catalog boot/isolinux/boot.cat \
            -no-emul-boot -boot-load-size 4 -boot-info-table \
            -isohybrid-mbr /usr/lib/ISOLINUX/isohdpfx.bin \
            -output ../marsh-os.iso .

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: marsh-os-xfce-iso
          path: marsh-os.iso
